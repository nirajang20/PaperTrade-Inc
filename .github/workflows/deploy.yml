name: Auto Deploy to paper-trade.org

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 74.208.158.229
          username: nirajan
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/nirajan/web/paper-trade.org/public_html

            echo "📂 Backup protected files..."
            cp dashboard/lib/Core.php /tmp/Core.php.bak || true
            cp dashboard/lib/LIB-database.php /tmp/LIB-database.php.bak || true

            echo "🚀 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "🔒 Restoring protected files..."
            cp /tmp/Core.php.bak dashboard/lib/Core.php || true
            cp /tmp/LIB-database.php.bak dashboard/lib/LIB-database.php || true

            echo "✅ Deployment complete"
