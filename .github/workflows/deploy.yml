- name: Deploy to VPS
  uses: appleboy/ssh-action@v0.1.10
  with:
    host: 74.208.158.229
    username: root
    key: ${{ secrets.VPS_SSH_KEY }}
    script: |
      set -e
      cd /var/www/html || exit 1
      echo "📂 Directory: $(pwd)"
      echo "🔎 Commit before deploy:"
      git log -1 --oneline || echo "No commits yet"

      echo "🚀 Running git fetch + checkout"
      git fetch origin main
      git checkout -B main origin/main
      git clean -fd

      echo "✅ Deployment done"
      echo "🔎 Commit after deploy:"
      git log -1 --oneline
      echo "📄 Last lines of test-db.php:"
      tail -n 3 test-db.php
