name: Auto Deploy to VPS (Preserve Config Files)

on:
  push:
    branches:
      - main

jobs:
  protect-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # full history needed to revert files

      # Step 1: Protect core.php & LIB-database.php in GitHub repo
      - name: Revert protected files if modified
        run: |
          protected_files=("core.php" "LIB-database.php")
          changed_files=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})

          for f in "${protected_files[@]}"; do
            if echo "$changed_files" | grep -q "^$f$"; then
              echo "⚠️ $f was modified, reverting..."
              git checkout HEAD~1 -- "$f"
              git config user.name "github-actions"
              git config user.email "actions@github.com"
              git commit -am "🔒 Reverted unauthorized change to $f"
              git push origin main
              exit 0   # stop here; a new workflow run will start after revert commit
            fi
          done

      # Step 2: Deploy to VPS but preserve configs
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 74.208.158.229
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/html

            echo "📂 Directory: $(pwd)"

            # Backup protected files before deploy
            for f in core.php LIB-database.php; do
              if [ -f "$f" ]; then
                cp "$f" "/tmp/$f.bak"
                echo "📦 Backed up $f"
              fi
            done

            echo "🚀 Fetching and updating main branch..."
            git fetch origin main
            git checkout -B main origin/main
            git clean -fd

            # Restore protected files
            for f in core.php LIB-database.php; do
              if [ -f "/tmp/$f.bak" ]; then
                mv "/tmp/$f.bak" "$f"
                echo "🔒 Restored $f (preserved config)"
              fi
            done

            echo "✅ Deployment done"
            echo "🔎 Commit after deploy:"
            git log -1 --oneline
