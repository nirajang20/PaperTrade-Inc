name: Auto Deploy to VPS (Preserve Config Files)

on:
  push:
    branches:
      - main

jobs:
  protect-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 74.208.158.229
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/html

            echo "📂 Backup protected files..."
            cp dashboard/lib/Core.php /tmp/Core.php.bak || true
            cp dashboard/lib/LIB-database.php /tmp/LIB-database.php.bak || true

            echo "🚀 Deploying latest code..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "🔒 Restoring protected files..."
            cp /tmp/Core.php.bak dashboard/lib/Core.php || true
            cp /tmp/LIB-database.php.bak dashboard/lib/LIB-database.php || true

            echo "✅ Deployment done (Core.php & LIB-database.php preserved)"
