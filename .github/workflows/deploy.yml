name: Auto Deploy to VPS (Preserve Config Files)

on:
  push:
    branches:
      - main

jobs:
  protect-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Step 1: Revert changes to protected files if modified
      - name: Ensure core.php & LIB-database.php stay frozen
        run: |
          protected_files=("core.php" "LIB-database.php")
          changed_files=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})

          for f in "${protected_files[@]}"; do
            if echo "$changed_files" | grep -q "^$f$"; then
              echo "⚠️ $f was modified, reverting to repo version..."
              git checkout HEAD~1 -- "$f"
              git config user.name "github-actions"
              git config user.email "actions@github.com"
              git commit -am "🔒 Reverted unauthorized change to $f"
              git push origin main
            fi
          done

      # Step 2: Deploy to VPS
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 74.208.158.229
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/html
            git fetch origin
            git reset --hard origin/main
            echo "✅ Deployment completed (core.php & LIB-database.php preserved)"
