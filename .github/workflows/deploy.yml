name: Auto Deploy to VPS via Bare Repo

on:
  push:
    branches:
      - main   # only deploy when pushing to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Push code to VPS bare repo
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 74.208.158.229
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 Starting deploy to VPS bare repo..."
            cd /root

            # If a mirror clone doesn't exist, create it
            if [ ! -d deploy-tmp ]; then
              git clone --mirror https://github.com/nirajang20/PaperTrade-Inc.git deploy-tmp
            fi

            cd deploy-tmp
            git remote update

            # Push all branches/tags into VPS bare repo
            git push --mirror ssh://root@74.208.158.229/var/repo/trade.git

            echo "✅ Code pushed to VPS bare repo. Post-receive hook will deploy into /var/www/html"
