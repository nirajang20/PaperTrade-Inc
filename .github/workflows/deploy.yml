name: Auto Deploy to VPS

on:
  push:
    branches:
      - main   # Only trigger deploy when pushing to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 74.208.158.229
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/html
            git fetch origin
            git reset --hard origin/main
            echo "✅ Deployment to /var/www/html completed"
